plugins {
    id 'com.android.application'
//    id 'kotlin-android'
//    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.android'
//    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace "com.learn4"
    compileSdkVersion 35
//    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId "com.learn4"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 133
        versionName "1.15.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets{
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
        //androidTest.java.srcDirs += 'src/androidTest/kotlin'
    }

    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_1_8
//        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ★ Kotlin도 17로 고정 (kapt 포함)
    kotlin {
        jvmToolchain(17)
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

repositories {
    flatDir {
        dirs "${rootDir}/blocklylib-core/libs"
    }
}

dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.navigation:navigation-fragment:2.2.2'
    implementation 'androidx.navigation:navigation-ui:2.2.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation project(path: ':PhysicaloidLibrary')
    implementation 'androidx.test.ext:junit:1.1.3'
    //testImplementation 'junit:junit:4.12'
    testImplementation('org.junit.jupiter:junit-jupiter:5.4.0')
    testImplementation('org.junit.jupiter:junit-jupiter-engine:5.4.0')
    //implementation 'net.cattaka:physicaloid:1.0.2'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation project(':blocklylib-vertical')
    implementation project(':blocklylib-core')

//    implementation 'dev.dworks.libs:volleyplus:+'
    // volleyplus가 더이상 지원하지 않음으로 대체
//    implementation 'dev.dworks.libs:volleyplus:0.1.4'
    implementation 'com.android.volley:volley:1.2.1'

    implementation 'com.squareup:otto:1.3.8'

    implementation 'com.orhanobut:logger:2.2.0'
    implementation "log4j:log4j:1.2+"
    implementation "de.mindpipe.android:android-logging-log4j:1.0.3"

    implementation 'net.yslibrary.keyboardvisibilityevent:keyboardvisibilityevent:3.0.0-RC2'
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'

//    implementation "androidx.room:room-runtime:2.4.2"
//    annotationProcessor "androidx.room:room-compiler:2.4.2"


    // kotlin 사용 설정
    implementation 'androidx.core:core-ktx:1.7.0'

    // kotlin 버전 통일(프로젝트, 앱, 모듈 모두 통일)
//    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.6.20"
//    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.6.10"

//    apply plugin: 'kotlin-kapt'
//    kapt("androidx.room:room-compiler:2.4.2")
    // ✅ Windows에서 Room verifier가 필요한 네이티브를 찾도록 추가
//    kapt "org.xerial:sqlite-jdbc:3.45.3.0"


    //RxJava
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.0.7'
    implementation 'io.reactivex.rxjava3:rxkotlin:3.0.0'

//    implementation "androidx.room:room-rxjava3:2.4.2"

    // Room 최신
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-rxjava3:2.6.1"
    ksp          "androidx.room:room-compiler:2.6.1"

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // okhttp
    implementation 'se.akerfeldt:okhttp-signpost:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    implementation 'oauth.signpost:signpost-core:1.2.1.2'

    implementation 'androidx.palette:palette:1.0.0'


    //tutor
    implementation 'org.xmlunit:xmlunit-core:2.6.4'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    implementation(platform("com.google.firebase:firebase-bom:30.3.1"))

    // Add the dependencies for the Crashlytics and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-analytics")

    // 결제 라이브러리(매년 정기적 업데이트 필요)
    def billing_version = "8.0.0"

    implementation "com.android.billingclient:billing:$billing_version"

}